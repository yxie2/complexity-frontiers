name: Border determinantal checks

on:
  push:
    paths:
      - 'papers/border-determinantal-permanent/**'
      - 'scripts/verify_border_determinantal.py'
      - '.gitattributes'
      - '.github/workflows/border-determinantal-checks.yml'
  pull_request:
    paths:
      - 'papers/border-determinantal-permanent/**'
      - 'scripts/verify_border_determinantal.py'
      - '.gitattributes'
      - '.github/workflows/border-determinantal-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install -r papers/border-determinantal-permanent/anc/requirements.txt
      - name: Verify artifacts and reproduce eight finite suites
        run: python scripts/verify_border_determinantal.py
